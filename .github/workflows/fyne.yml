name: Экспериментальная Fyne-версия Windows
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fyne:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Настроить C-компилятор
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Зависимости и тесты
        working-directory: fyneapp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cmd/setup/payload | Out-Null
          [IO.File]::WriteAllBytes("$PWD/cmd/setup/payload/MikroTikInspectorFyne.exe", [byte[]](77,90))
          go mod tidy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- go.mod go.sum
          if ($LASTEXITCODE -ne 0) {
            foreach ($f in @('go.mod','go.sum')) {
              $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD/$f"))
              for ($i=0; $i -lt $base64.Length; $i+=1500) { $len=[Math]::Min(1500, $base64.Length-$i); Write-Host ("::notice::LOCK:$f`:$i`:" + $base64.Substring($i,$len)) }
            }
            throw "go.mod/go.sum расходятся с go mod tidy"
          }
          go test -tags ci ./... 2>&1 | Tee-Object -FilePath ../fyne-test-error.txt
          if ($LASTEXITCODE -ne 0) { Get-Content ../fyne-test-error.txt | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          go vet -tags ci ./... 2>&1 | Tee-Object -FilePath ../fyne-vet-error.txt
          if ($LASTEXITCODE -ne 0) { Get-Content ../fyne-vet-error.txt | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      - name: Собрать Fyne приложение
        working-directory: fyneapp
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          Remove-Item cmd/setup/payload/MikroTikInspectorFyne.exe
          go build -trimpath -ldflags "-s -w -H windowsgui" -o cmd/setup/payload/MikroTikInspectorFyne.exe ./cmd/inspector 2>&1 | Tee-Object -FilePath ../fyne-build-error.txt
          if ($LASTEXITCODE -ne 0) { Get-Content ../fyne-build-error.txt | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      - name: Собрать Fyne установщик
        working-directory: fyneapp
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H windowsgui" -o ../dist/mikrotik-inspector-v0.4.0-fyne-setup.exe ./cmd/setup 2>&1 | Tee-Object -FilePath ../fyne-setup-error.txt
          if ($LASTEXITCODE -ne 0) { Get-Content ../fyne-setup-error.txt | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          $p=Start-Process -FilePath ../dist/mikrotik-inspector-v0.4.0-fyne-setup.exe -ArgumentList '--verify-payload' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Проверка встроенного EXE не прошла: $($p.ExitCode)" }
          Get-FileHash ../dist/mikrotik-inspector-v0.4.0-fyne-setup.exe -Algorithm SHA256 | Format-List
      - name: Установщик Fyne (экспериментальная версия)
        uses: actions/upload-artifact@v7
        with:
          name: mikrotik-inspector-v0.4.0-fyne-windows-setup
          path: dist/mikrotik-inspector-v0.4.0-fyne-setup.exe
          if-no-files-found: error
          retention-days: 14
