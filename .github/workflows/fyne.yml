name: Экспериментальная Fyne-версия Windows
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fyne:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Настроить C-компилятор
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Зависимости и тесты
        working-directory: fyneapp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cmd/setup/payload | Out-Null
          [IO.File]::WriteAllBytes("$PWD/cmd/setup/payload/MikroTikInspectorFyne.exe", [byte[]](77,90))
          go mod tidy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags ci ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -tags ci ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Контрольные суммы зависимостей
        uses: actions/upload-artifact@v7
        with:
          name: fyne-module-lock
          path: |
            fyneapp/go.mod
            fyneapp/go.sum
      - name: Собрать приложение и Fyne-установщик
        working-directory: fyneapp
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H windowsgui" -o cmd/setup/payload/MikroTikInspectorFyne.exe ./cmd/inspector
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-s -w -H windowsgui" -o ../dist/mikrotik-inspector-v0.1.0-fyne-setup.exe ./cmd/setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p=Start-Process -FilePath ../dist/mikrotik-inspector-v0.1.0-fyne-setup.exe -ArgumentList '--verify-payload' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Проверка встроенного EXE не прошла: $($p.ExitCode)" }
          Get-FileHash ../dist/mikrotik-inspector-v0.1.0-fyne-setup.exe -Algorithm SHA256 | Format-List
      - name: Установщик Fyne (экспериментальная версия)
        uses: actions/upload-artifact@v7
        with:
          name: mikrotik-inspector-v0.1.0-fyne-windows-setup
          path: dist/mikrotik-inspector-v0.1.0-fyne-setup.exe
          if-no-files-found: error
          retention-days: 14
