name: test-debug

on:
  push:
    branches: ["arena/bd3bb0fe-my-mikrotik"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    name: Диагностика прогона
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настройка Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt -l
        continue-on-error: true
        run: gofmt -l . > debug-output.txt 2>&1

      - name: gofmt -d
        continue-on-error: true
        run: gofmt -d mikrotik/backup.go mikrotik/backup_test.go mikrotik/config.go >> debug-output.txt 2>&1

      - name: go vet
        continue-on-error: true
        run: go vet ./... >> debug-output.txt 2>&1

      - name: go test
        continue-on-error: true
        run: go test -count=1 ./... >> debug-output.txt 2>&1

      - name: Пример скрипта бэкапа
        continue-on-error: true
        run: |
          mkdir -p /tmp/dbg && cat > /tmp/dbg/main_test.go <<'EOF'
          package mikrotik

          import (
            "regexp"
            "strings"
            "testing"
            "time"
          )

          func TestDumpBackupScript(t *testing.T) {
            device := &Info{RouterOS: "7.15", Packages: []Package{{Name: "routeros"}}}
            s := &Settings{Backup: BackupSettings{Enabled: true, From: "router@example.com", Recipient: "admin@example.com",
              SMTPServer: "mail.csl.by", SMTPPort: "587", SMTPUser: "mikrotik@csl.by", SMTPPass: "secret",
              TLS: "starttls", Password: "", Time: "02:30", Interval: "1d"}}
            res := Generate(device, nil, s, time.Now())
            if !res.OK {
              t.Fatal(res.Error)
            }
            out := res.Script
            re := regexp.MustCompile(`source="((?:[^"\\]|\\.)*)"`)
            m := re.FindStringSubmatch(out)
            if m != nil {
              dec := strings.NewReplacer(`\\`, `\`, `\"`, `"`, `\n`, "\n", `\$`, `$`)
              out = dec.Replace(m[1])
            }
            t.Logf("\n=== SCRIPT ===\n%s\n=== END ===", out)
          }
          EOF
          cp /tmp/dbg/main_test.go mikrotik/zz_dump_test.go
          go test -count=1 -run TestDumpBackupScript -v ./mikrotik/ >> debug-output.txt 2>&1
          rm -f mikrotik/zz_dump_test.go

      - name: Публикация результата
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git add -f debug-output.txt
          git commit -m "debug: вывод прогона" || echo "нечего коммитить"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
