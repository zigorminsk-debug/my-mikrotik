name: Test debug

on:
  push:
    branches: ["arena/**"]

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Собрать вывод тестов
        run: |
          {
            echo "== gofmt -l =="
            gofmt -l . || true
            echo "== gofmt -d =="
            gofmt -d . 2>&1 | head -120 || true
            echo "== vet =="
            go vet ./... 2>&1 || true
            echo "== test =="
            go test -count=1 ./... 2>&1 | tail -60 || true
            echo "== конец =="
          } > debug-out.txt
      - name: Сохранить вывод в ветку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f debug-out.txt
          git commit -m "debug: вывод тестов" || exit 0
          git fetch origin "${GITHUB_REF_NAME}" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push --force origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
