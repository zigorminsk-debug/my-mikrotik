name: CI

# Сборка и тесты запускаются на каждый push во все ветки проекта,
# а также на pull request в main и вручную (workflow_dispatch).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Форматирование, vet и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настройка Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # внешних зависимостей нет — кеш не нужен

      - name: Проверка gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Не отформатированные файлы:"
            echo "$unformatted"
            exit 1
          fi

      - name: Проверка защит интерфейса
        run: |
          node web/ui.test.cjs
          node web/snapshot.test.cjs

      - name: go vet
        run: go vet ./...

      - name: go test (-race)
        run: go test -race -count=1 ./...

  android:
    name: Проверка Android-кода
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настройка Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt, vet, тесты и сборка bridge под Android
        working-directory: android
        env:
          # golang.org/x/mobile подтягивается как зависимость (нужна gomobile bind).
          GOFLAGS: -mod=mod
        run: |
          go get golang.org/x/mobile@latest
          go mod tidy
          gofmt -l . | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt
          go vet ./...
          go test -count=1 ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./bridge
          CGO_ENABLED=0 GOOS=android GOARCH=arm go build ./bridge

  build:
    name: Сборка ${{ matrix.artifact }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            artifact: mikrotik-inspector-linux-amd64
            ext: ""
          - runner: windows-latest
            goos: windows
            artifact: mikrotik-inspector-windows-amd64.exe
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настройка Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Определение версии
        shell: bash
        run: |
          # Версия хранится в main.go; git describe выдаёт только хеш при
          # поверхностном checkout и не совпадает с номером в UI.
          VERSION="$(sed -n 's/^var version = "\([^"]*\)"$/\1/p' main.go)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Сборка
        shell: bash
        run: |
          mkdir -p dist
          EXTRA=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXTRA="-H windowsgui"; fi
          go build -trimpath \
            -ldflags "-s -w ${EXTRA} -X main.version=${VERSION}" \
            -o "dist/${{ matrix.artifact }}" .

      - name: Загрузка портативной сборки Windows
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: mikrotik-inspector-v${{ env.VERSION }}-windows-portable
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Иконка для установщика и ярлыков
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          go run ./tools/makeicon -out windows/app.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Сборка установщика Windows
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DSourceExe=$PWD\dist\${{ matrix.artifact }}" "/DSetupIcon=$PWD\windows\app.ico" "/DOutputDir=$PWD\dist" windows/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Проверка установленной программы Windows
        if: matrix.goos == 'windows'
        shell: pwsh
        run: ./windows/smoke-test.ps1 -Installer "$PWD/dist/mikrotik-inspector-v$env:VERSION-windows-setup.exe"

      - name: Загрузка установщика Windows отдельно
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: mikrotik-inspector-v${{ env.VERSION }}-windows-setup
          path: dist/mikrotik-inspector-v${{ env.VERSION }}-windows-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
