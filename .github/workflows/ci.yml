name: CI

# Сборка и тесты запускаются на каждый push во все ветки проекта,
# а также на pull request в main и вручную (workflow_dispatch).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Форматирование, vet и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настройка Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # внешних зависимостей нет — кеш не нужен

      - name: Проверка gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Не отформатированные файлы:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (-race)
        run: go test -race -count=1 ./...

  android:
    name: Проверка Android-кода
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настройка Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt, vet и сборка bridge под Android
        working-directory: android
        run: |
          gofmt -l . | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt
          go vet ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./bridge
          CGO_ENABLED=0 GOOS=android GOARCH=arm go build ./bridge

  build:
    name: Сборка ${{ matrix.artifact }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            artifact: mikrotik-inspector-linux-amd64
            ext: ""
          - runner: windows-latest
            goos: windows
            artifact: mikrotik-inspector-windows-amd64.exe
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настройка Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Определение версии
        shell: bash
        run: |
          VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Сборка
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${{ matrix.artifact }}" .

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
